# Render deploys the API from this file. In the Render dashboard: New +
# Blueprint, point it at this GitHub repo. Render provisions the service
# below and prompts for every env var marked "sync: false" — those are
# filled in through the Render dashboard, never committed here.
services:
  - type: web
    name: recipeupgrader-api
    runtime: node
    plan: free
    region: oregon
    # NODE_ENV=production is set below for the running server, but pnpm
    # skips devDependencies (typescript, @types/node, ...) during install
    # when NODE_ENV is "production" - and the build itself needs those.
    # Overriding it to "development" for just the install step avoids that.
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @recipeupgrader/api... run build
    startCommand: pnpm --filter @recipeupgrader/api run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false # the deployed Cloudflare Pages URL, e.g. https://recipeupgrader.pages.dev
      - key: TOKEN_FACTORY_API_KEY
        sync: false
      - key: TOKEN_FACTORY_BASE_URL
        sync: false
      - key: MODEL_FAST
        sync: false
      - key: MODEL_REASONING
        sync: false
      - key: USDA_API_KEY
        sync: false
